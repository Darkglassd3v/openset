name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Apple Silicon binaries must be signed, so they are built on a Mac
  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx pkg@5.8.1 . --targets node18-macos-arm64 --output build/openset-macos-arm64
      - run: codesign --force --sign - build/openset-macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: openset-macos-arm64
          path: build/openset-macos-arm64

  build-release:
    needs: build-macos-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: |
          npm test
          python3 -m unittest discover -s remote-script/tests

      - name: Read version (the tag must match package.json)
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$VERSION" = "$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: OpenSet icon and version in the Windows program
        run: |
          npx -y pkg-fetch@3.4.2 -n node18 -p win -a x64
          npm install --no-save resedit@3.1.0
          node scripts/win-icon.mjs

      - name: Build standalone binaries (pkg)
        run: |
          npx pkg@5.8.1 . \
            --targets node18-linux-x64,node18-win-x64,node18-macos-x64 \
            --out-path build
          node scripts/win-icon.mjs --check build/openset-win.exe

      - uses: actions/download-artifact@v4
        with:
          name: openset-macos-arm64
          path: build

      - name: PDF guide (version, new features, steps for every platform)
        run: |
          mkdir -p release
          node scripts/build-guide.js "release/OpenSet-${{ steps.ver.outputs.version }}-Guida.pdf"

      - name: Assemble platform packages
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          for PLAT in linux-x64 win-x64 macos-x64 macos-arm64; do
            DIR="pkg-$PLAT"
            mkdir -p "$DIR"
            case "$PLAT" in
              win-x64)     SRC=build/openset-win.exe ;;
              macos-arm64) SRC=build/openset-macos-arm64 ;;
              *)           SRC="build/openset-${PLAT%-x64}" ;;
            esac
            # app assets (the Remote Script without its tests)
            cp -r public lyrics remote-script README.md "$DIR/"
            rm -rf "$DIR/remote-script/tests"
            find "$DIR/remote-script" -name __pycache__ -prune -exec rm -rf {} +  # left by the test step
            # program, named with the version
            case "$PLAT" in
              macos-*)
                # "OpenSet <version>.app" with the icon; the assets go inside it
                bash scripts/make-macos-app.sh "$DIR" "$VERSION" "$SRC" "$DIR/public" "$DIR/lyrics" "$DIR/remote-script"
                rm -rf "$DIR/public" "$DIR/lyrics" ;;
              win-x64) cp "$SRC" "$DIR/openset-$VERSION.exe" ;;
              *)       cp "$SRC" "$DIR/openset-$VERSION"; chmod +x "$DIR/openset-$VERSION" ;;
            esac
            # required files: openset_<version>, version file, install guide
            echo "$VERSION" > "$DIR/openset_$VERSION"
            echo "$VERSION" > "$DIR/VERSION.txt"
            case "$PLAT" in
              linux-*) GUIDE=dist-extras/INSTALL-linux.txt ;;
              win-*)   GUIDE=dist-extras/INSTALL-windows.txt ;;
              macos-*) GUIDE=dist-extras/INSTALL-macos.txt ;;
            esac
            sed "s/{{VERSION}}/$VERSION/g" "$GUIDE" > "$DIR/INSTALL.txt"
            cp "release/OpenSet-$VERSION-Guida.pdf" "$DIR/"
            ( cd "$DIR" && zip -rq "../release/openset-$VERSION-$PLAT.zip" . )
          done
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: OpenSet ${{ github.ref_name }}
          files: |
            release/*.zip
            release/*.pdf
          body: |
            ## OpenSet ${{ steps.ver.outputs.version }}

            Controller di scaletta open-source per Ableton Live. Ogni zip contiene
            il programma `openset-${{ steps.ver.outputs.version }}` (Node.js incluso),
            il Remote Script per Live, l'interfaccia web, `VERSION.txt`, la guida
            `INSTALL.txt` per la piattaforma e `OpenSet-${{ steps.ver.outputs.version }}-Guida.pdf`
            (novità di questa versione e passi per ogni piattaforma, anche qui tra gli asset).

            ### Windows
            ```powershell
            Expand-Archive openset-${{ steps.ver.outputs.version }}-win-x64.zip -DestinationPath C:\OpenSet
            C:\OpenSet\openset-${{ steps.ver.outputs.version }}.exe
            ```

            ### macOS
            `openset-${{ steps.ver.outputs.version }}-macos-arm64.zip` per Apple Silicon (M1–M4),
            `openset-${{ steps.ver.outputs.version }}-macos-x64.zip` per Mac Intel. Estrai lo zip,
            sposta `OpenSet ${{ steps.ver.outputs.version }}.app` in Applicazioni e, al primo avvio:
            ```bash
            xattr -dr com.apple.quarantine "/Applications/OpenSet ${{ steps.ver.outputs.version }}.app"
            ```
            poi doppio clic sull'app: si apre il Terminale con OpenSet e il browser.

            ### Linux
            ```bash
            unzip openset-${{ steps.ver.outputs.version }}-linux-x64.zip -d openset && cd openset
            chmod +x openset-${{ steps.ver.outputs.version }}
            ./openset-${{ steps.ver.outputs.version }}
            ```

            Il browser si apre da solo; su Windows e macOS il Remote Script viene
            installato nella User Library di Live. Riavvia Live e scegli OpenSet in
            Impostazioni → Link, Tempo e MIDI → Superficie di controllo.
