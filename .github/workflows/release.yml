name: Build & Release

on:
  push:
    tags:
      - "v*"
  # a change to the release itself is built on its pull request; nothing is published
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/assemble-release.sh
      - scripts/build-guide.js
      - scripts/make-macos-app.sh
      - scripts/win-icon.mjs
      - scripts/build-sea.mjs
      - dist-extras/**

permissions:
  contents: write

jobs:
  # One job on a Mac: the Apple Silicon program is signed there and nothing passes
  # between jobs, so a release uses no Actions artifact storage (release assets
  # do not count against it).
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: |
          npm test
          python3 -m unittest discover -s remote-script/tests

      - name: Read version (a tag must match package.json)
        id: ver
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "${GITHUB_REF_NAME#v}" = "$VERSION"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Node single executables with the newest Node 24 LTS; on this Mac both Mac programs
      # are signed ad hoc, the Windows one gets the OpenSet icon and version
      - name: Build the programs (Node SEA)
        run: |
          node scripts/build-sea.mjs --out build
          node scripts/win-icon.mjs --check build/openset-win.exe

      - name: PDF guide (version, new features, steps for every platform)
        env:
          CHROME: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: |
          mkdir -p release
          node scripts/build-guide.js "release/OpenSet-${{ steps.ver.outputs.version }}-Guida.pdf"

      - name: Assemble platform packages
        run: bash scripts/assemble-release.sh "${{ steps.ver.outputs.version }}" build release

      # shared with the other projects: checks the names and the guide inside every zip,
      # writes short notes from CHANGELOG.md and publishes only for tags (no artifacts)
      - name: GitHub Release
        uses: Darkglassd3v/.github/actions/release@v1
        with:
          version: ${{ steps.ver.outputs.version }}
          files: release/*.zip
          title: OpenSet v${{ steps.ver.outputs.version }}
