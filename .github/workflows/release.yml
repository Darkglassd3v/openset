name: Build & Release

on:
  push:
    tags:
      - "v*"
  # a change to the release itself is built on its pull request; nothing is published
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/assemble-release.sh
      - scripts/build-guide.js
      - scripts/make-macos-app.sh
      - scripts/win-icon.mjs
      - scripts/release-notes.js
      - dist-extras/**

permissions:
  contents: write

jobs:
  # One job on a Mac: the Apple Silicon program is signed there and nothing passes
  # between jobs, so a release uses no Actions artifact storage (release assets
  # do not count against it).
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: |
          npm test
          python3 -m unittest discover -s remote-script/tests

      - name: Read version (a tag must match package.json)
        id: ver
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "${GITHUB_REF_NAME#v}" = "$VERSION"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: OpenSet icon and version in the Windows program
        run: |
          npx -y pkg-fetch@3.4.2 -n node18 -p win -a x64
          npm install --no-save resedit@3.1.0
          node scripts/win-icon.mjs

      - name: Build standalone binaries (pkg)
        run: |
          npx pkg@5.8.1 . \
            --targets node18-linux-x64,node18-win-x64,node18-macos-x64 \
            --out-path build
          npx pkg@5.8.1 . --targets node18-macos-arm64 --output build/openset-macos-arm64
          codesign --force --sign - build/openset-macos-arm64
          node scripts/win-icon.mjs --check build/openset-win.exe

      - name: PDF guide (version, new features, steps for every platform)
        env:
          CHROME: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: |
          mkdir -p release
          node scripts/build-guide.js "release/OpenSet-${{ steps.ver.outputs.version }}-Guida.pdf"

      - name: Assemble platform packages
        run: bash scripts/assemble-release.sh "${{ steps.ver.outputs.version }}" build release

      - name: Release notes (short changelog; the guide is inside every zip)
        run: node scripts/release-notes.js "${{ steps.ver.outputs.version }}" > release-notes.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: OpenSet ${{ github.ref_name }}
          # only the zips: a separate PDF may be skipped, the guide is inside each zip
          files: release/*.zip
          body_path: release-notes.md
