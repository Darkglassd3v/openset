name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: node18-linux-x64
            ext: ""
          - os: windows-latest
            target: node18-win-x64
            ext: .exe
          - os: macos-latest # Apple Silicon
            target: node18-macos-arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # Live 12 embeds Python 3.11

      - run: npm ci

      - name: Node tests with coverage
        run: npm run coverage

      - name: Remote Script tests
        run: python -m unittest discover -s remote-script/tests -v

      - name: Program name with the version
        run: echo "BIN=openset-$(node -p "require('./package.json').version")${{ matrix.ext }}" >> "$GITHUB_ENV"

      - name: OpenSet icon and version in the Windows program
        if: runner.os == 'Windows'
        run: |
          npx -y pkg-fetch@3.4.2 -n node18 -p win -a x64
          npm install --no-save resedit@3.1.0
          node scripts/win-icon.mjs

      - name: Build standalone binary
        run: npx pkg@5.8.1 . --targets ${{ matrix.target }} --output "build/$BIN"

      - name: Check the icon and version of the Windows program
        if: runner.os == 'Windows'
        run: node scripts/win-icon.mjs --check "build/$BIN"

      - name: Ad-hoc sign (macOS arm64 refuses unsigned binaries)
        if: runner.os == 'macOS'
        run: codesign --force --sign - "build/$BIN"

      - name: macOS app bundle (the smoke test runs the program inside it)
        if: runner.os == 'macOS'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          bash scripts/make-macos-app.sh build "$VERSION" "build/$BIN" public lyrics remote-script
          plutil -lint "build/OpenSet $VERSION.app/Contents/Info.plist"
          echo "RUN=build/OpenSet $VERSION.app/Contents/Resources/$BIN" >> "$GITHUB_ENV"

      - name: Smoke test the binary
        run: |
          cp -r public lyrics build/
          VERSION=$(node -p "require('./package.json').version")
          PORT=39080 "./${RUN:-build/$BIN}" --no-open > build/run.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:39080/api/state > build/state.json; then break; fi
            sleep 1
          done
          cat build/run.log
          grep -q '"connected":false' build/state.json
          grep -q "\"version\":\"$VERSION\"" build/state.json
          head -1 build/run.log | tr -d '\r' | grep -qx "OpenSet $VERSION"
          grep -q "\[data\] copied lyrics" build/run.log
          curl -sf http://127.0.0.1:39080/ | grep -q Palco
          curl -sf http://127.0.0.1:39080/api/connect | grep -q "\"urls\""
          kill %1 || true
